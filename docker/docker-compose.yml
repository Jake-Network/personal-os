# Personal OS backend + PostgreSQL
#
# 사용법:
#   cp docker/env.sample docker/.env      # POSTGRES_PASSWORD 채우기
#   docker compose -f docker/docker-compose.yml up -d --build
#   docker compose -f docker/docker-compose.yml logs -f app
#   docker compose -f docker/docker-compose.yml down            # 데이터 유지
#   docker compose -f docker/docker-compose.yml down -v         # DB·키 볼륨까지 삭제
#
# 프론트엔드는 컨테이너 밖에서 실행합니다:  cd frontend && corepack yarn dev
# (Next.js가 /api 를 SERVER_DOMAIN, 기본 http://127.0.0.1:8000 으로 프록시)
#
# 모든 포트는 127.0.0.1 에만 바인딩합니다. 인증·TLS가 없으므로 외부에 노출하지 마세요.

name: personal-os

services:
  db:
    build:
      context: ..
      dockerfile: docker/dockerfiles/db/Dockerfile
    image: personal-os-postgres-vector:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-personal_os}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?docker/.env 에 POSTGRES_PASSWORD 를 설정하세요}
      POSTGRES_DB: ${POSTGRES_DB:-personal_os}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: docker/dockerfiles/app/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-personal_os}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-personal_os}
      PERSONAL_OS_DATA_DIR: /project/data
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      EMBEDDING_DENSECORE_MODEL_ID: ${EMBEDDING_DENSECORE_MODEL_ID:-}
      EMBEDDING_URL: ${EMBEDDING_URL:-http://embeddings:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      # The OAuth redirect lands on the host port, not the container port.
      OAUTH_CALLBACK_PORT: ${API_PORT:-8000}
      # Bind mounts from a Windows drive (WSL /mnt/c) deliver no change events.
      WATCHFILES_FORCE_POLLING: "true"
    # Dev: live reload from the mounted source. Drop `command` and the ../app mount for an immutable image.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "app"]
    volumes:
      - ../app:/project/app
      - ../migrations:/project/migrations:ro
      - ../alembic.ini:/project/alembic.ini:ro
      - app_data:/project/data
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  embeddings:
    image: ollama/ollama:0.18.2
    profiles: ["rag"]
    restart: unless-stopped
    volumes:
      - embedding_data:/root/.ollama

volumes:
  db_data:
  app_data:
  embedding_data:
