[project]
name = "personal-os"
version = "0.1.0"
description = "Personal OS — personal data dashboard and AI advisor backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16",
    "cryptography>=44",
    "fastapi>=0.143.3",
    "google-api-python-client>=2.180",
    "google-auth>=2.40",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "pgvector>=0.4.1",
    "pypdf>=6",
    "python-multipart>=0.0.22",
    "pyjwt[crypto]>=2.10",
    "sqlalchemy>=2.1.5",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
