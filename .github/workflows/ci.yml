name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: personal_os
          POSTGRES_PASSWORD: personal_os
          POSTGRES_DB: personal_os_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U personal_os" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # Job-level env cannot use runner context; initialize it on the runner.
      # Tests use mocked LLM providers only; no OAuth tokens or API keys exist in CI.
      - name: Configure test data directory
        run: echo "PERSONAL_OS_DATA_DIR=$RUNNER_TEMP/personal-os-data" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Audit locked Python dependencies
        run: |
          uv export --frozen --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/personal-os-requirements.txt"
          uvx pip-audit==2.10.1 --requirement "$RUNNER_TEMP/personal-os-requirements.txt" --no-deps --disable-pip
      - name: Migrations on PostgreSQL (upgrade, model check, downgrade, re-upgrade)
        env:
          DATABASE_URL: postgresql+psycopg://personal_os:personal_os@localhost:5432/personal_os_test
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head
      # ORM schema fixtures expect the extension in public, independent of migration history.
      - name: Enable pgvector
        env:
          PGPASSWORD: personal_os
        run: psql -h localhost -U personal_os -d personal_os_test -c "CREATE EXTENSION IF NOT EXISTS vector"
      # Tests run only on this disposable PostgreSQL service.
      - name: pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://personal_os:personal_os@localhost:5432/personal_os_test
          TEST_PG_DUMP_CONTAINER: ${{ job.services.postgres.id }}
        run: uv run pytest -q

  frontend:
    name: Frontend (lint, typecheck, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn audit --level moderate
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build

  e2e:
    name: Browser smoke tests (Playwright, fake model provider)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: personal_os
          POSTGRES_PASSWORD: personal_os
          POSTGRES_DB: personal_os_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U personal_os" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # scripts/e2e_server.py refuses any database not ending in `_e2e` and never calls a real provider.
      E2E_DATABASE_URL: postgresql+psycopg://personal_os:personal_os@localhost:5432/personal_os_e2e
    steps:
      - uses: actions/checkout@v4
      - name: Configure E2E data directory
        run: echo "E2E_DATA_DIR=$RUNNER_TEMP/personal-os-e2e-data" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn playwright install --with-deps chromium
      - run: yarn playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7
